name: "Submit to Web Store"
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check release tag matches package.json version
        if: github.event_name == 'release'
        run: |
          pkg="v$(node -p 'require("./package.json").version')"
          tag="${{ github.event.release.tag_name }}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::Release tag $tag does not match package.json version $pkg"
            exit 1
          fi
      - name: Build the extension
        run: pnpm build
      - name: Attach builds to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          for t in chrome-mv3 firefox-mv2 edge-mv3; do
            cp "build/$t-prod.zip" "simple-totp-manager-$tag-$t.zip"
          done
          gh release upload "$tag" simple-totp-manager-$tag-*.zip --clobber
      - name: Browser Platform Publish
        uses: PlasmoHQ/bpp@v3
        with:
          keys: ${{ secrets.SUBMIT_KEYS }}
