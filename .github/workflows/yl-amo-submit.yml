name: "Submit YT Ledger to AMO (one-off)"
on:
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout yt-history-poc
        uses: actions/checkout@v4
        with:
          repository: sankalpmukim/yt-history-poc
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and package the Firefox extension
        run: |
          pnpm build:firefox
          pnpm package:firefox
      - name: Derive AMO credentials from SUBMIT_KEYS
        env:
          SUBMIT_KEYS: ${{ secrets.SUBMIT_KEYS }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          SUBMIT_KEYS="$SUBMIT_KEYS" node -e '
            const keys = JSON.parse(process.env.SUBMIT_KEYS);
            const out = { firefox: { apiKey: keys.firefox.apiKey, apiSecret: keys.firefox.apiSecret } };
            require("node:fs").writeFileSync(process.env.RUNNER_TEMP + "/keys/amo.json", JSON.stringify(out));
          '
      - name: Submit to addons.mozilla.org
        env:
          AMO_KEYS_JSON: ${{ runner.temp }}/keys/amo.json
        run: |
          git archive --format=zip -o "$RUNNER_TEMP/source.zip" v0.12.0
          node scripts/amo-submit.mjs build/firefox-mv3-prod.zip "$RUNNER_TEMP/source.zip"
      - name: Shred credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/keys/amo.json" "$RUNNER_TEMP/source.zip"
